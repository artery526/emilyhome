<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emily's Home</title>
  <meta name="description" content="Emily's Home：私密心情日記、照片與抽牌記錄入口。">
  <style>
    :root {
      color-scheme: light;
      --ink: #26302c;
      --muted: #6b766f;
      --line: #dce3de;
      --paper: #fbfaf6;
      --panel: #ffffff;
      --sage: #496b5a;
      --rose: #b75c73;
      --mist: #eef4ef;
      --danger: #a54848;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(251, 250, 246, .92), rgba(251, 250, 246, .72)),
        url("background.png") center top / cover fixed,
        var(--paper);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      letter-spacing: 0;
    }
    header {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 12px 20px 7px;
      background: transparent;
      border-bottom: 1px solid rgba(107, 118, 111, .14);
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 22px; }
    .brand-logo {
      display: block;
      width: min(280px, 52vw);
      padding: 2px;
      border-radius: 8px;
      background: rgba(255, 250, 240, .14);
      box-shadow: 0 4px 10px rgba(156, 96, 91, .045);
    }
    .brand-button {
      border: 0;
      min-height: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    .gate-settings-toggle {
      position: absolute;
      left: calc(50% + 154px);
      top: 18px;
    }
    .gate-login-panel {
      position: absolute;
      left: 50%;
      top: calc(100% + 10px);
      z-index: 5;
      width: min(360px, calc(100vw - 32px));
      transform: translateX(-50%);
      text-align: left;
    }
    .login-location-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .brand-logo img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      mix-blend-mode: multiply;
      opacity: .88;
      filter: saturate(.96) contrast(.95);
    }
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 22px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      align-items: start;
    }
    .card {
      background: rgba(255, 255, 255, .9);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(39, 49, 45, .06);
      backdrop-filter: blur(8px);
    }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin: 20px 0 12px;
    }
    .section-head p, .muted { color: var(--muted); line-height: 1.55; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }
    button, input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 40px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }
    button { cursor: pointer; }
    button.primary {
      background: var(--sage);
      border-color: var(--sage);
      color: #fff;
    }
    button.ghost { background: var(--mist); }
    button.danger {
      background: #fff3f3;
      border-color: #efcfcf;
      color: var(--danger);
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    input, select, textarea { width: 100%; }
    textarea { min-height: 120px; resize: vertical; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .entry-form {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .entry-form .title-field,
    .entry-form .full {
      grid-column: 1 / -1;
    }
    .entry-form .title-field {
      grid-column: span 2;
    }
    .entry-form .date-field,
    .entry-form .time-field,
    .entry-form .privacy-field,
    .entry-form .password-field {
      grid-column: span 2;
    }
    .full { grid-column: 1 / -1; }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      border-radius: 999px;
      background: var(--mist);
      color: var(--sage);
      border-color: #d2ddd5;
      min-height: 34px;
    }
    .tag.active {
      background: var(--sage);
      color: #fff;
    }
    .view-tabs {
      position: absolute;
      left: calc(50% + 154px);
      top: 50%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      max-width: 0;
      max-height: 46px;
      margin: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateY(-50%) translateX(-8px);
      transition: max-width .22s ease, opacity .18s ease, transform .18s ease;
      white-space: nowrap;
    }
    header.nav-open .view-tabs {
      max-width: 760px;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) translateX(0);
    }
    .view-tabs #refreshBtn { margin-left: 0; }
    .client-people-list, .client-record-list { display: grid; gap: 10px; }
    .client-person-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
    .client-person-button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 10px; }
    .client-person-button.active { background: var(--green, #4d7966); color: #fff; }
    .client-record { border: 1px solid var(--line, #d8e1dc); border-radius: 12px; padding: 14px; background: rgba(255,255,255,.72); }
    .client-record-heading { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .client-feedback { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line, #d8e1dc); }
    .client-feedback-item { padding: 8px 0; border-bottom: 1px dashed var(--line, #d8e1dc); white-space: pre-wrap; }
    .client-feedback-item { display: flex; justify-content: space-between; gap: 8px; }
    .client-feedback-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .client-feedback-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; margin-top: 10px; }
    .client-feedback-form > label { grid-column: 1 / -1; }
    .client-feedback-form > button[type="submit"] { grid-column: 1; }
    .client-feedback-form > button[data-feedback-cancel] { grid-column: 2; }
    .client-feedback-form textarea[name="content"] { min-height: 120px; resize: vertical; }
    .client-card-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .client-card-thumb { width: 44px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line, #d8e1dc); }
    .client-edit-media { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; border: 1px dashed var(--line, #d8e1dc); border-radius: 10px; }
    .client-edit-media-item { display: grid; gap: 5px; justify-items: center; }
    .client-edit-media-item img { width: 68px; height: 84px; object-fit: cover; border-radius: 7px; cursor: zoom-in; border: 1px solid var(--line, #d8e1dc); }
    .client-photo-button { border: 0; padding: 0; background: transparent; min-height: 0; }
    .client-card-fields { display: grid; gap: 8px; margin-top: 6px; }
    .client-card-slot { display: grid; grid-template-columns: 1fr 120px auto; gap: 8px; align-items: center; }
    .client-card-slot .remove-card { min-width: 40px; }
    .learning-entry-list { display: grid; gap: 10px; }
    .learning-entry { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
    .learning-entry-heading { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .learning-entry-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .learning-date-picker { position: relative; width: 40px; height: 40px; flex: 0 0 40px; cursor: pointer; }
    .learning-date-input { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; margin: 0; opacity: .01; cursor: pointer; }
    .learning-date-picker .learning-date-button { pointer-events: none; }
    .learning-date-button { white-space: nowrap; }
    .learning-heading-actions { display: flex; align-items: center; gap: 8px; }
    .learning-subject-select { width: auto; min-width: 150px; max-width: 52vw; padding: 8px 28px 8px 10px; font-size: 13px; }
    .learning-global-results { display: grid; gap: 8px; margin-top: 12px; }
    .learning-global-result { display: grid; gap: 3px; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
    .learning-global-result small { color: var(--muted); }
    .learning-entry-content { white-space: pre-wrap; line-height: 1.7; margin-top: 8px; }
    .learning-gallery { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .learning-gallery button { border: 0; padding: 0; min-height: 0; background: transparent; }
    .learning-gallery img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; cursor: zoom-in; border: 1px solid var(--line); }
    .learning-search { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 10px 0 12px; }
    .learning-subject-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0 4px; }
    .learning-subject-tab { display: flex; justify-content: center; align-items: center; gap: 6px; }
    .learning-subject-tab.active { background: var(--sage); border-color: var(--sage); color: var(--paper); font-weight: 700; }
    .learning-subject-count { min-width: 22px; padding: 1px 6px; border-radius: 999px; background: rgba(255,255,255,.16); font-size: 12px; }
    .learning-list-heading { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 12px; }
    .learning-list-heading h3 { margin: 0; }
    .view-tab.active {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
    }
    .view-tab-image {
      display: block;
      width: 110px;
      height: auto;
      max-width: 100%;
      object-fit: contain;
      border-radius: 6px;
      mix-blend-mode: normal;
    }
    .image-action-button {
      min-height: 0;
      padding: 0;
      background: transparent;
      border-color: transparent;
    }
    .view-tab[data-view="journal"],
    .view-tab[data-view="cards"],
    .view-tab[data-view="body"],
    .view-tab[data-view="clients"],
    .view-tab[data-view="learning"] {
      min-height: 0;
      padding: 0;
      background: transparent;
      border-color: transparent;
    }
    .view-tab[data-view="journal"].active,
    .view-tab[data-view="cards"].active,
    .view-tab[data-view="body"].active,
    .view-tab[data-view="clients"].active,
    .view-tab[data-view="learning"].active {
      background: transparent;
      border-color: transparent;
      color: var(--ink);
    }
    .view-panel[hidden] { display: none; }
    .timeline-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .timeline-heading h3 {
      margin: 0;
    }
    .timeline-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 12px;
    }
    .draw-mode {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .draw-mode button.active {
      background: var(--sage);
      border-color: var(--sage);
      color: #fff;
    }
    .card-draw-set {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 120px;
      gap: 10px;
      align-items: end;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }
    .card-preview {
      display: grid;
      gap: 6px;
      justify-items: center;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .card-thumb {
      width: 72px;
      aspect-ratio: 3 / 4;
      border-radius: 8px;
      border: 1px solid #ead0da;
      background:
        linear-gradient(150deg, rgba(255, 246, 248, .96), rgba(236, 246, 239, .96));
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--rose);
      font-size: 26px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-record-list {
      display: grid;
      gap: 10px;
    }
    .cards-panel .grid {
      gap: 16px;
    }
    .cards-panel .library-controls {
      grid-template-columns: minmax(160px, 1fr) minmax(160px, 1fr) auto;
      max-width: 100%;
    }
    .card-record {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .chip {
      border: 1px solid #ead0da;
      border-radius: 999px;
      background: #fff6f8;
      color: var(--rose);
      padding: 4px 8px;
      font-size: 12px;
    }
    .entry-list {
      display: grid;
      gap: 10px;
    }
    .entry {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
    }
    .entry button {
      cursor: pointer;
    }
    .cover {
      width: 74px;
      height: 74px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--mist);
    }
    .cover-button {
      border: 0;
      padding: 0;
      min-height: 0;
      border-radius: 8px;
      background: transparent;
    }
    .entry-title {
      font-weight: 700;
      margin-bottom: 4px;
    }
    .entry-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .entry-excerpt {
      color: #5f6761;
      font-size: 15px;
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .weekday {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 4px;
    }
    .day {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      text-align: left;
    }
    .day.weekend {
      background: #fff3f3;
      border-color: #efcfcf;
    }
    .day.has-entry {
      background: #f4e9ed;
      color: var(--rose);
      border-color: #e6cdd5;
    }
    .day.today {
      background: #fff1c9;
      color: #7a5b24;
      border-color: #d9ae58;
      box-shadow: inset 0 0 0 2px rgba(217, 174, 88, .22);
    }
    .today-label {
      display: block;
      margin-top: 3px;
      color: #9a6b18;
      font-size: 10px;
      font-weight: 700;
    }
    .day.active {
      outline: 2px solid var(--rose);
    }
    .dot-row {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 6px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--rose);
      display: inline-block;
    }
    .entry-count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      margin-top: 6px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--rose);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 3px 8px rgba(183, 92, 115, .22);
    }
    .body-day.has-period {
      background: #fff0f4;
      border-color: #efc0cf;
    }
    .body-day.has-asthma {
      background: #eef7fb;
      border-color: #b9dbe8;
    }
    .body-day.has-period.has-asthma {
      background: linear-gradient(135deg, #fff0f4 0 50%, #eef7fb 50% 100%);
    }
    .body-marker {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
    }
    .body-marker.period { background: #d86f8d; }
    .body-marker.asthma { background: #5aa8c4; }
    .body-record-list {
      display: grid;
      gap: 10px;
    }
    .body-record {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }
    .lock-panel {
      border: 1px solid #ead0da;
      border-radius: 8px;
      background: rgba(255, 246, 248, .86);
      padding: 12px;
      margin: 10px 0 12px;
    }
    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .panel-heading h3 { margin: 0; }
    .icon-button {
      width: 40px;
      min-height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--mist);
      color: var(--sage);
    }
    .settings-panel[hidden] { display: none; }
    .gate-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .library-controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
    }
    .body-month-controls {
      grid-template-columns: 1fr 1fr;
    }
    .library-panel summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--ink);
      list-style: none;
    }
    .library-panel summary::-webkit-details-marker { display: none; }
    .library-panel summary::after {
      content: "展開";
      float: right;
      color: var(--rose);
      font-size: 13px;
      font-weight: 600;
    }
    .library-panel[open] summary::after { content: "收合"; }
    .library-panel .library-body {
      margin-top: 12px;
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
      gap: 8px;
      max-height: 320px;
      overflow: auto;
      padding: 4px;
      align-items: start;
    }
    .media-card {
      position: relative;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 0;
      overflow: hidden;
      background: var(--mist);
      aspect-ratio: 1;
      width: 100%;
      min-height: 0;
      height: auto;
    }
    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .media-card.active { border-color: var(--rose); }
    .status {
      white-space: pre-wrap;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
    }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--sage); }
    .detail {
      white-space: pre-wrap;
      line-height: 1.7;
      color: var(--ink);
    }
    dialog.entry-reader {
      width: min(760px, calc(100vw - 28px));
      max-height: min(82vh, 760px);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 26px 70px rgba(39, 49, 45, .22);
      overflow: hidden;
    }
    dialog.entry-reader::backdrop {
      background: rgba(38, 48, 44, .28);
      backdrop-filter: blur(4px);
    }
    .reader-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      max-height: min(82vh, 760px);
    }
    .reader-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 249, 244, .94);
    }
    .reader-top h3 {
      font-size: 18px;
    }
    .reader-content {
      overflow: auto;
      padding: 16px;
    }
    .reader-entry .detail {
      margin-top: 12px;
      font-size: 16px;
    }
    .reader-entry .edit-media-grid {
      grid-template-columns: minmax(0, 1fr);
    }
    .edit-media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }
    .edit-media-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .edit-media-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
    .edit-media-card video {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 70vh;
      margin: 0 auto;
      object-fit: contain;
      background: #111;
    }
    .edit-media-card label {
      padding: 8px;
    }
    .upload-status-list {
      display: grid;
      gap: 6px;

      <button class="ghost image-action-button" type="button" id="lockAppBtn" aria-label="鎖定" title="鎖定"><img class="view-tab-image" src="lock.png?v=20260826-2054" alt="鎖定"></button>
    </div>
  </header>

  <main>
    <section class="gate" id="gate">
      <div class="gate-hero">
        <button class="gate-hero-button" type="button" id="gateHeroLoginBtn" title="進入秘密小花園">
          <video id="loginVideo" autoplay muted playsinline preload="auto" aria-label="進入秘密小花園動態圖案"><source src="logoin.mp4" type="video/mp4"></video>
        </button>
      </div>
    </section>

    <section class="app" id="app" hidden>
      <section class="view-panel" id="journalView">
      <div class="grid">
        <section class="card span-12 journal-calendar-card">
          <h3 id="calendarTitle">🌙 本月月曆</h3>
          <div class="library-controls">
            <select id="journalYear"></select>
            <select id="journalMonth"></select>
          </div>
          <div class="calendar" id="calendar"></div>
        </section>
        <section class="card span-12" id="createCard">
          <h3 id="entryFormTitle">💌 新增心情日記</h3>
          <form id="entryForm" class="form-grid entry-form">
            <label class="title-field">標題<input name="title" placeholder="主題是?"></label>
            <label class="date-field">日期<input name="date" type="date" required></label>
            <label class="time-field">時間<input name="time" type="time" step="60"></label>
            <label class="privacy-field">文章權限
              <select name="visibility">
                <option value="normal">不上鎖</option>
                <option value="password">上鎖</option>
              </select>
            </label>
            <label class="password-field" hidden>解鎖密碼<input name="entryPassword" type="password" placeholder="選擇上鎖時填寫，會同步到試算表"></label>
            <label class="full">快速標籤
              <input name="tags" id="tagsInput" placeholder="可手動補標籤，用逗號分隔">
            </label>
            <div class="tag-row full" id="tagPicker"></div>
            <label class="full">日記內容<textarea name="content" required placeholder="今天發生什麼？我想留下什麼？"></textarea></label>
            <div class="full" id="entryEditMedia" hidden></div>
            <label class="upload-field">上傳照片或影片<input name="media" type="file" accept="image/*,video/*,.heic,.heif" multiple></label>
            <label class="upload-field">語音備忘<input name="media" type="file" accept="audio/*,.m4a,.mp3,.wav,.webm" multiple></label>
            <div class="upload-status-list full" id="entryUploadStatus"></div>
            <button class="primary full" type="submit" id="entrySubmitBtn">🧸 記錄</button>
            <button class="ghost full" type="button" id="cancelEntryEditBtn" hidden>取消編輯，回到新增日記</button>
          </form>
          <p class="status" id="formStatus"></p>
        </section>
        <section class="card span-12">
          <div class="timeline-heading">
            <h3>🌿 時間軸</h3>
            <button class="icon-button" type="button" id="timelineSearchBtn" aria-expanded="false" aria-controls="timelineSearchPanel" title="搜尋時間軸">🔍</button>
          </div>
          <div class="timeline-search" id="timelineSearchPanel" hidden>
            <input id="timelineSearchInput" type="search" placeholder="搜尋標題、摘要、日期或時間">
            <button class="ghost" type="button" id="timelineSearchClearBtn">清除</button>
          </div>
          <div class="entry-list" id="entryList"><p class="muted">載入中...</p></div>
        </section>

        <details class="card span-12 library-panel" id="libraryPanel">
          <summary>🖼️找尋歷史軌跡</summary>
          <div class="library-body">
            <div class="library-controls">
              <select id="libraryYear"></select>
              <select id="libraryMonth"></select>
              <button type="button" id="loadLibraryBtn">載入 ✨</button>
            </div>
            <p class="status" id="libraryStatus">尚未載入 Photos。</p>
            <div class="media-grid" id="libraryGrid"></div>
          </div>
        </details>

      </div>
      </section>

      <section class="view-panel cards-panel" id="cardView" hidden>
        <div class="grid">
          <section class="card span-12">
            <h3>🔮 記錄卡牌</h3>
            <form id="cardForm" class="form-grid" style="margin-top:14px">
              <label>日期<input name="date" type="date" required></label>
              <label>時間<input name="time" type="time" step="60"></label>
              <label class="full">抽牌模式
                <div class="draw-mode">
                  <button class="active" type="button" data-draw-mode="single">塔羅單張</button>
                  <button type="button" data-draw-mode="three">塔羅三張</button>
                  <button type="button" data-draw-mode="osho">奧修單張</button>
                </div>
              </label>
              <div class="full" id="cardDrawFields"></div>
              <label class="full">提問 / 主題<input name="cardQuestion" placeholder="今天我需要知道什麼？"></label>
              <label class="full">解讀 / 備註<textarea name="cardReading" placeholder="直覺、感受、身體訊號或想留給自己的提醒"></textarea></label>
              <button class="primary full" type="submit">🔮 記錄卡牌</button>
            </form>
            <p class="status" id="cardStatus"></p>
          </section>
          <section class="card span-12">
            <h3>🃏 卡牌時間軸</h3>
            <div class="library-controls">
              <select id="cardTimelineYear"></select>
              <select id="cardTimelineMonth"></select>
              <button type="button" id="cardTimelineApply">顯示 ✨</button>
            </div>
            <div class="card-record-list" id="cardRecordList"><p class="muted">載入中...</p></div>
          </section>
        </div>
      </section>

      <section class="view-panel" id="bodyView" hidden>
        <div class="grid">
          <section class="card span-8">
            <h3 id="bodyCalendarTitle">🌙 身體記錄月曆</h3>
            <div class="library-controls body-month-controls">
              <select id="bodyYear"></select>
              <select id="bodyMonth"></select>
            </div>
            <div class="calendar" id="bodyCalendar"></div>
            <p class="status" id="bodyStatus"></p>
          </section>
          <section class="card span-4">
            <div class="panel-heading">
              <h3>♥️ 健康日記</h3>
              <button class="icon-button" type="button" id="bodyTokenSettingsBtn" aria-expanded="false" aria-controls="bodyTokenSettings" title="試算表 Token 設定">⚙️</button>
            </div>
            <div class="settings-panel lock-panel" id="bodyTokenSettings" hidden>
              <label class="full">試算表寫入 Token
                <input id="sheetTokenInput" type="password" placeholder="身體記錄直接寫入 Google Sheet 時使用">
              </label>
              <div class="toolbar">
                <button class="ghost" type="button" id="saveSheetTokenBtn">💾 記住試算表 Token</button>
                <button class="ghost" type="button" id="clearSheetTokenBtn">🧹 清除試算表 Token</button>
              </div>
            </div>
            <form id="bodyForm" class="form-grid" style="margin-top:14px">
              <label class="full">日期<input name="date" type="date" required></label>
              <label class="full">類型
                <select name="type">
                  <option value="月經">🌸 月經來時</option>
                  <option value="氣喘">🫧 氣喘發作日</option>
                </select>
              </label>
              <label class="body-period-field">流量
                <select name="flow">
                  <option value="">未指定</option>
                  <option value="少">少</option>
                  <option value="中">中</option>
                  <option value="多">多</option>
                </select>
              </label>
              <label class="body-period-field">疼痛 0-10<input name="painLevel" type="number" min="0" max="10" step="1" placeholder="0"></label>
              <label class="body-asthma-field">氣喘誘因
                <select name="asthmaTrigger">
                  <option value="">未指定</option>
                  <option value="天氣">天氣</option>
                  <option value="灰塵">灰塵</option>
                  <option value="自律神經">自律神經</option>
                  <option value="腸胃">腸胃</option>
                  <option value="嗆到">嗆到</option>
                  <option value="運動">運動</option>
                  <option value="不確定">不確定</option>
                </select>
              </label>
              <label class="full body-asthma-field">影像記錄<input id="bodyImageInput" name="bodyImage" type="file" accept="image/*,.heic,.heif" multiple><small class="muted">可上傳氣喘發作時的相關照片，不輸入文字備註。</small></label>
              <div class="full upload-status-list" id="bodyImageStatus"></div>
              <button class="primary full" type="submit">🌙 寫入身體記錄</button>
            </form>
          </section>
          <section class="card span-12">
            <div class="panel-heading">
              <h3 id="bodyDayTitle">📍 整月記錄</h3>
              <button class="icon-button" type="button" id="bodyLockSettingsBtn" aria-expanded="false" aria-controls="bodyLockSettings" title="當月記錄鎖定設定">⚙️</button>
            </div>
            <div class="settings-panel lock-panel" id="bodyLockSettings" hidden>
              <h3>🔐 當月記錄鎖定</h3>
              <div class="form-grid" style="margin-top:10px">
                <label class="full">解鎖密碼
                  <input id="bodyPasswordInput" type="password" placeholder="輸入身體記錄檢視密碼">
                </label>
                <label class="full">初始設定 / 更換密碼
                  <input id="bodyNewPasswordInput" type="password" placeholder="第一次使用或要更換時填寫">
                </label>
                <button class="primary" type="button" id="bodyUnlockBtn">🔓 解鎖當月記錄</button>
                <button class="ghost" type="button" id="bodySetPasswordBtn">🔐 設定密碼</button>
                <button class="ghost full" type="button" id="bodyLockBtn">🔒 重新上鎖</button>
              </div>
            </div>
            <div class="body-record-list" id="bodyRecordList"><p class="muted">載入後會顯示整月身體記錄。</p></div>
          </section>
        </div>
      </section>

      <section class="view-panel" id="clientView" hidden>
        <div class="grid">
          <section class="card span-4">
            <h3>✍️ 客戶記錄</h3>
            <input id="clientSearchInput" type="search" placeholder="搜尋人物名稱或備註" style="margin-top:12px">
            <div class="client-people-list" id="clientPeopleList" style="margin-top:12px"><p class="muted">載入中...</p></div>
            <details class="settings-panel" style="margin-top:14px">
              <summary>新增人物</summary>
              <form id="clientPersonForm" class="form-grid" style="margin-top:12px">
                <input type="hidden" name="id">
                <label class="full">人物名稱<input name="name" required placeholder="例如：小美"></label>
                <label class="full">備註<textarea name="notes" rows="3" placeholder="人物背景或提醒"></textarea></label>
                <button class="primary full" type="submit" id="clientPersonSubmit">新增人物</button>
                <button class="danger full" type="button" id="clientPersonDeleteBtn" hidden>🗑️ 刪除此人物設定</button>
              </form>
            </details>
            <p class="status" id="clientPeopleStatus"></p>
          </section>
          <section class="card span-8">
            <div class="panel-heading"><h3 id="clientRecordsTitle">請先選擇人物 ✍️</h3><button class="ghost" type="button" id="clientRefreshBtn">🔄</button></div>
            <form id="clientRecordForm" class="form-grid" style="margin-top:14px" hidden>
              <input type="hidden" name="id">
              <label>日期<input name="date" type="date" required></label>
              <label>時間<input name="time" type="time" step="60"></label>
              <label class="full">對方問題<textarea name="question" rows="4" required placeholder="請完整記錄對方提出的問題與背景"></textarea></label>
              <label>抽牌模式<select name="spreadType"><option value="2選1牌陣">2選1牌陣</option><option value="塔羅單張">塔羅單張</option><option value="塔羅三張">塔羅三張</option><option value="奧修單張">奧修單張</option></select></label>
              <div class="full">
                <label>牌陣卡牌</label>
                <div id="clientCardFields" class="client-card-fields"></div>
                <button class="ghost" type="button" id="addClientCardBtn" style="margin-top:8px">＋ 新增卡牌</button>
              </div>
              <label class="full">解讀內容<textarea name="reading" rows="6" placeholder="記錄這次的解讀內容"></textarea></label>
              <label class="upload-field full">追加附件照片<input name="media" type="file" accept="image/*,.heic,.heif" multiple></label>
              <div class="full client-edit-media" id="clientEditMedia" hidden></div>
              <div class="full upload-status-list" id="clientUploadStatus"></div>
              <button class="primary" type="submit" id="clientRecordSubmit">✍️ 儲存算牌紀錄</button>
              <button class="ghost" type="button" id="clientRecordCancel" hidden>取消編輯</button>
            </form>
            <p class="status" id="clientRecordStatus"></p>
            <div class="client-record-list" id="clientRecordList"><p class="muted">選擇人物後顯示算牌紀錄。</p></div>
          </section>
        </div>
      </section>

      <section class="view-panel" id="learningView" hidden>
        <div class="grid">
          <section class="card span-12">
            <div class="panel-heading">
              <h3>📚 學習日誌</h3>
              <div class="learning-heading-actions">
                <select id="learningSubjectSelect" class="learning-subject-select" aria-label="選擇學習科目"></select>
                <button class="icon-button" type="button" id="learningGlobalSearchBtn" title="搜尋全部學習筆記" aria-label="搜尋全部學習筆記">🔍</button>
              </div>
            </div>
          </section>
          <section class="card span-12" id="learningComposerCard">
            <div class="panel-heading">
              <h3>📝 新增學習筆記</h3>
              <label class="learning-date-picker" id="learningDatePicker" for="learningDateInput">
                <span class="icon-button learning-date-button" id="learningDateBtn" title="選擇記錄日期" aria-label="選擇記錄日期" role="button">📅</span>
                <input class="learning-date-input" id="learningDateInput" name="date" form="learningForm" type="date" required aria-label="記錄日期">
              </label>
            </div>
            <form id="learningForm" class="form-grid" style="margin-top:14px">
              <input type="hidden" name="id">
              <label>科目<select name="subject" required><option value="" disabled>請選擇科目</option><option value="chinese">國文</option><option value="english-vocabulary">英文單字</option><option value="english-grammar">英文文法</option><option value="law">法律</option><option value="social">社會</option></select></label>
              <label>標題<input name="title" required placeholder="今天學到了什麼？"></label>
              <label class="full">學習內容<textarea name="content" rows="7" required placeholder="記錄筆記、心得或下一步"></textarea></label>
              <label class="upload-field full">上傳照片<input name="media" type="file" accept="image/*,.heic,.heif" multiple></label>
              <div class="full upload-status-list" id="learningUploadStatus"></div>
              <div class="full edit-media-grid" id="learningEditMedia" hidden></div>
              <button class="primary" type="submit" id="learningSubmitBtn">📚 儲存學習日誌</button>
              <button class="ghost" type="button" id="learningCancelBtn" hidden>取消編輯</button>
            </form>
            <p class="status" id="learningStatus"></p>
          </section>
          <section class="card span-12" id="learningListCard" hidden>
            <div class="learning-list-heading"><h3 id="learningListTitle">國文筆記</h3><div class="learning-entry-actions"><button class="icon-button" type="button" id="learningSearchBtn" aria-expanded="false" aria-controls="learningSearchPanel" title="搜尋目前科目筆記">🔍</button><button class="icon-button" type="button" id="learningAddBtn" title="新增筆記">📝</button></div></div>
            <div class="learning-search" id="learningSearchPanel" hidden>
              <input id="learningSearchInput" type="search" placeholder="搜尋標題、內容或日期">
              <button class="ghost" type="button" id="learningSearchClearBtn">清除</button>
            </div>
            <div class="learning-entry-list" id="learningEntryList"><p class="muted">載入中...</p></div>
          </section>
        </div>
      </section>
    </section>
  </main>

  <dialog class="entry-reader learning-search-dialog" id="learningGlobalSearchDialog">
    <div class="reader-shell">
      <div class="reader-top">
        <h3>🔍 搜尋全部學習筆記</h3>
        <button class="ghost" type="button" id="closeLearningGlobalSearch">關閉</button>
      </div>
      <div class="reader-content">
        <input id="learningGlobalSearchInput" type="search" placeholder="輸入關鍵字搜尋所有科目">
        <div class="learning-global-results" id="learningGlobalSearchResults"><p class="muted">輸入關鍵字開始搜尋。</p></div>
      </div>
    </div>
  </dialog>

  <dialog class="entry-reader" id="entryReaderDialog">
    <div class="reader-shell">
      <div class="reader-top">
        <h3>📖 閱讀全文</h3>
        <button class="ghost" type="button" id="closeEntryReader">關閉</button>
      </div>
      <div class="reader-content" id="entryReaderContent"></div>
    </div>
  </dialog>

  <dialog class="photo-viewer" id="photoViewer">
    <div class="toolbar">
      <button class="ghost" type="button" id="photoZoomOutBtn" aria-label="縮小">−</button>
      <button class="ghost" type="button" id="photoZoomResetBtn" aria-label="原始大小">100%</button>
      <button class="ghost" type="button" id="photoZoomInBtn" aria-label="放大">＋</button>
      <button class="ghost photo-nav" type="button" id="photoPrevBtn" aria-label="上一張">‹</button>
      <span class="photo-counter" id="photoCounter"></span>
      <button class="ghost photo-nav" type="button" id="photoNextBtn" aria-label="下一張">›</button>
      <button class="ghost" type="button" id="closePhotoViewer">關閉</button>
    </div>
    <div class="photo-stage" id="photoStage">
      <img id="photoViewerImg" alt="">
      <video id="photoViewerVideo" controls playsinline hidden></video>
    </div>
  </dialog>

  <script src="scripts/emilyhome.js?v=20260826-logo-video"></script>
</body>
