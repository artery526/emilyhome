<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emily's Home</title>
  <meta name="description" content="Emily's Home：私密心情日記、照片與抽牌記錄入口。">
  <style>
    :root {
      color-scheme: light;
      --ink: #26302c;
      --muted: #6b766f;
      --line: #dce3de;
      --paper: #fbfaf6;
      --panel: #ffffff;
      --sage: #496b5a;
      --rose: #b75c73;
      --mist: #eef4ef;
      --danger: #a54848;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(251, 250, 246, .92), rgba(251, 250, 246, .72)),
        url("background.png") center top / cover fixed,
        var(--paper);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      letter-spacing: 0;
    }
    header {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      background: transparent;
      border-bottom: 0;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 22px; }
    .brand-logo {
      display: block;
      width: min(230px, 46vw);
      padding: 2px;
      border-radius: 8px;
      background: rgba(255, 250, 240, .14);
      box-shadow: 0 4px 10px rgba(156, 96, 91, .045);
    }
    .brand-logo img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      mix-blend-mode: multiply;
      opacity: .88;
      filter: saturate(.96) contrast(.95);
    }
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 22px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      align-items: start;
    }
    .card {
      background: rgba(255, 255, 255, .9);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(39, 49, 45, .06);
      backdrop-filter: blur(8px);
    }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin: 20px 0 12px;
    }
    .section-head p, .muted { color: var(--muted); line-height: 1.55; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }
    button, input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 40px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }
    button { cursor: pointer; }
    button.primary {
      background: var(--sage);
      border-color: var(--sage);
      color: #fff;
    }
    button.ghost { background: var(--mist); }
    button.danger {
      background: #fff3f3;
      border-color: #efcfcf;
      color: var(--danger);
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    input, select, textarea { width: 100%; }
    textarea { min-height: 120px; resize: vertical; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .entry-form {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .entry-form .title-field,
    .entry-form .full {
      grid-column: 1 / -1;
    }
    .entry-form .date-field,
    .entry-form .time-field,
    .entry-form .privacy-field,
    .entry-form .password-field {
      grid-column: span 2;
    }
    .full { grid-column: 1 / -1; }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      border-radius: 999px;
      background: var(--mist);
      color: var(--sage);
      border-color: #d2ddd5;
      min-height: 34px;
    }
    .tag.active {
      background: var(--sage);
      color: #fff;
    }
    .view-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
    }
    .view-tabs #refreshBtn { margin-left: 0; }
    .view-tab.active {
      background: var(--rose);
      border-color: var(--rose);
      color: #fff;
    }
    .view-panel[hidden] { display: none; }
    .draw-mode {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .draw-mode button.active {
      background: var(--sage);
      border-color: var(--sage);
      color: #fff;
    }
    .card-draw-set {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 120px;
      gap: 10px;
      align-items: end;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }
    .card-preview {
      display: grid;
      gap: 6px;
      justify-items: center;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .card-thumb {
      width: 72px;
      aspect-ratio: 3 / 4;
      border-radius: 8px;
      border: 1px solid #ead0da;
      background:
        linear-gradient(150deg, rgba(255, 246, 248, .96), rgba(236, 246, 239, .96));
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--rose);
      font-size: 26px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-record-list {
      display: grid;
      gap: 10px;
    }
    .cards-panel .grid {
      gap: 16px;
    }
    .cards-panel .library-controls {
      grid-template-columns: minmax(160px, 1fr) minmax(160px, 1fr) auto;
      max-width: 100%;
    }
    .card-record {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .chip {
      border: 1px solid #ead0da;
      border-radius: 999px;
      background: #fff6f8;
      color: var(--rose);
      padding: 4px 8px;
      font-size: 12px;
    }
    .entry-list {
      display: grid;
      gap: 10px;
    }
    .entry {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
    }
    .entry button {
      cursor: pointer;
    }
    .cover {
      width: 74px;
      height: 74px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--mist);
    }
    .cover-button {
      border: 0;
      padding: 0;
      min-height: 0;
      border-radius: 8px;
      background: transparent;
    }
    .entry-title {
      font-weight: 700;
      margin-bottom: 4px;
    }
    .entry-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .weekday {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 4px;
    }
    .day {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      text-align: left;
    }
    .day.weekend {
      background: #fff3f3;
      border-color: #efcfcf;
    }
    .day.has-entry {
      background: #f4e9ed;
      color: var(--rose);
      border-color: #e6cdd5;
    }
    .day.active {
      outline: 2px solid var(--rose);
    }
    .dot-row {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 6px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--rose);
      display: inline-block;
    }
    .body-day.has-period {
      background: #fff0f4;
      border-color: #efc0cf;
    }
    .body-day.has-asthma {
      background: #eef7fb;
      border-color: #b9dbe8;
    }
    .body-day.has-period.has-asthma {
      background: linear-gradient(135deg, #fff0f4 0 50%, #eef7fb 50% 100%);
    }
    .body-marker {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
    }
    .body-marker.period { background: #d86f8d; }
    .body-marker.asthma { background: #5aa8c4; }
    .body-record-list {
      display: grid;
      gap: 10px;
    }
    .body-record {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }
    .lock-panel {
      border: 1px solid #ead0da;
      border-radius: 8px;
      background: rgba(255, 246, 248, .86);
      padding: 12px;
      margin: 10px 0 12px;
    }
    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .panel-heading h3 { margin: 0; }
    .icon-button {
      width: 40px;
      min-height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--mist);
      color: var(--sage);
    }
    .settings-panel[hidden] { display: none; }
    .library-controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
    }
    .library-panel summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--ink);
      list-style: none;
    }
    .library-panel summary::-webkit-details-marker { display: none; }
    .library-panel summary::after {
      content: "展開";
      float: right;
      color: var(--rose);
      font-size: 13px;
      font-weight: 600;
    }
    .library-panel[open] summary::after { content: "收合"; }
    .library-panel .library-body {
      margin-top: 12px;
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
      gap: 8px;
      max-height: 320px;
      overflow: auto;
      padding: 4px;
      align-items: start;
    }
    .media-card {
      position: relative;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 0;
      overflow: hidden;
      background: var(--mist);
      aspect-ratio: 1;
      width: 100%;
      min-height: 0;
      height: auto;
    }
    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .media-card.active { border-color: var(--rose); }
    .status {
      white-space: pre-wrap;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
    }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--sage); }
    .detail {
      white-space: pre-wrap;
      line-height: 1.7;
      color: var(--ink);
    }
    .edit-media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }
    .edit-media-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .edit-media-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
    .edit-media-card label {
      padding: 8px;
    }
    .upload-status-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .upload-status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .9);
      padding: 8px 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .upload-status-item strong {
      color: var(--ink);
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .upload-status-item.ok { border-color: #c8ded2; background: #f2faf5; }
    .upload-status-item.error { border-color: #efcfcf; background: #fff3f3; }
    .upload-status-item.loading { border-color: #e4d7bb; background: #fffaf0; }
    dialog.photo-viewer {
      width: min(920px, calc(100vw - 28px));
      border: 0;
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }
    dialog.photo-viewer::backdrop {
      background: rgba(20, 24, 22, .62);
    }
    .photo-viewer img {
      width: 100%;
      max-height: 78vh;
      object-fit: contain;
      display: block;
      border-radius: 8px;
    }
    .gate {
      min-height: 52vh;
      display: grid;
      place-items: center;
    }
    .gate .card {
      width: min(620px, 100%);
    }
    .app[hidden], .gate[hidden] { display: none; }
    @media (max-width: 900px) {
      .span-4, .span-5, .span-7, .span-8 { grid-column: span 12; }
      .form-grid, .library-controls, .card-draw-set { grid-template-columns: 1fr; }
      .entry-form .date-field,
      .entry-form .time-field,
      .entry-form .privacy-field,
      .entry-form .password-field {
        grid-column: 1 / -1;
      }
      main { padding: 14px; }
      header { align-items: start; }
      .brand-logo {
        width: min(210px, 76vw);
      }
      .view-tabs {
        position: sticky;
        top: 0;
        z-index: 3;
        padding-bottom: 8px;
      }
      .view-tabs #refreshBtn { margin-left: 0; }
      .media-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        max-height: none;
        overflow: visible;
      }
      .media-card {
        aspect-ratio: 1;
        border-width: 1px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 class="brand-logo"><img src="cssindex.png" alt="Emily's Home"></h1>
  </header>

  <main>
    <section class="gate" id="gate">
      <div class="card">
        <h2>🔐 需要連線到私密後端</h2>
        <p class="muted">這個 GitHub Pages 入口不會直接存放或顯示文章內容。通過後端登入後，才會載入時間軸、月曆、照片與抽牌記錄 🐰✨</p>
        <div class="form-grid" style="margin-top:14px">
          <label class="full">API 位置
            <input id="apiBaseInput" placeholder="例如 https://api.ark-os26.cc">
          </label>
          <label class="full">本機測試 Token
            <input id="tokenInput" type="password" placeholder="正式 Cloudflare Access 可留空">
          </label>
          <button class="primary full" type="button" id="connectBtn">🌙 連線</button>
          <button class="ghost full" type="button" id="clearTokenBtn">🧹 清除已記住的 Token</button>
        </div>
        <p class="status" id="gateStatus"></p>
      </div>
    </section>

    <section class="app" id="app" hidden>
      <div class="view-tabs">
        <button class="view-tab active" type="button" data-view="journal">🌿 心情日記</button>
        <button class="view-tab" type="button" data-view="cards">🔮 記錄卡牌</button>
        <button class="view-tab" type="button" data-view="body">🌙 身體記錄</button>
        <button class="ghost" type="button" id="refreshBtn">🔄 重新整理</button>
      </div>

      <section class="view-panel" id="journalView">
      <div class="grid">
        <section class="card span-7">
          <h3>🌿 時間軸</h3>
          <div class="entry-list" id="entryList"><p class="muted">載入中...</p></div>
        </section>
        <section class="card span-5">
          <h3 id="calendarTitle">🌙 本月月曆</h3>
          <div class="calendar" id="calendar"></div>
        </section>

        <details class="card span-12 library-panel">
          <summary>🖼️找尋歷史軌跡</summary>
          <div class="library-body">
            <div class="library-controls">
              <select id="libraryYear"></select>
              <select id="libraryMonth"></select>
              <button type="button" id="loadLibraryBtn">載入 ✨</button>
            </div>
            <p class="status" id="libraryStatus">尚未載入 Photos。</p>
            <div class="media-grid" id="libraryGrid"></div>
          </div>
        </details>

        <section class="card span-12" id="createCard">
          <h3>💌 新增心情日記</h3>
          <form id="entryForm" class="form-grid entry-form">
            <label class="title-field">標題<input name="title" placeholder="主題是?"></label>
            <label class="date-field">日期<input name="date" type="date" required></label>
            <label class="time-field">時間<input name="time" type="time" step="60"></label>
            <label class="privacy-field">文章權限
              <select name="visibility">
                <option value="normal">不上鎖</option>
                <option value="password">上鎖</option>
              </select>
            </label>
            <label class="password-field" hidden>解鎖密碼<input name="entryPassword" type="password" placeholder="選擇上鎖時填寫，會同步到試算表"></label>
            <label class="full">快速標籤
              <input name="tags" id="tagsInput" placeholder="可手動補標籤，用逗號分隔">
            </label>
            <div class="tag-row full" id="tagPicker"></div>
            <label class="full">日記內容<textarea name="content" required placeholder="今天發生什麼？我想留下什麼？"></textarea></label>
            <label>上傳照片<input name="media" type="file" accept="image/*,.heic,.heif" multiple></label>
            <label>語音備忘<input name="media" type="file" accept="audio/*,.m4a,.mp3,.wav,.webm" multiple></label>
            <div class="upload-status-list full" id="entryUploadStatus"></div>
          <button class="primary full" type="submit">🧸 記錄</button>
          </form>
          <p class="status" id="formStatus"></p>
        </section>

        <section class="card span-12">
          <h3>📖 完整閱讀 / 編輯文章</h3>
          <div class="detail" id="entryDetail">點選時間軸文章後可閱讀完整內文。上鎖文章會先要求解鎖密碼 🔐</div>
        </section>
      </div>
      </section>

      <section class="view-panel cards-panel" id="cardView" hidden>
        <div class="grid">
          <section class="card span-12">
            <h3>🔮 記錄卡牌</h3>
            <form id="cardForm" class="form-grid" style="margin-top:14px">
              <label>日期<input name="date" type="date" required></label>
              <label>時間<input name="time" type="time" step="60"></label>
              <label class="full">抽牌模式
                <div class="draw-mode">
                  <button class="active" type="button" data-draw-mode="single">塔羅單張</button>
                  <button type="button" data-draw-mode="three">塔羅三張</button>
                  <button type="button" data-draw-mode="osho">奧修單張</button>
                </div>
              </label>
              <div class="full" id="cardDrawFields"></div>
              <label class="full">提問 / 主題<input name="cardQuestion" placeholder="今天我需要知道什麼？"></label>
              <label class="full">解讀 / 備註<textarea name="cardReading" placeholder="直覺、感受、身體訊號或想留給自己的提醒"></textarea></label>
              <button class="primary full" type="submit">🔮 記錄卡牌</button>
            </form>
            <p class="status" id="cardStatus"></p>
          </section>
          <section class="card span-12">
            <h3>🃏 卡牌時間軸</h3>
            <div class="library-controls">
              <select id="cardTimelineYear"></select>
              <select id="cardTimelineMonth"></select>
              <button type="button" id="cardTimelineApply">顯示 ✨</button>
            </div>
            <div class="card-record-list" id="cardRecordList"><p class="muted">載入中...</p></div>
          </section>
        </div>
      </section>

      <section class="view-panel" id="bodyView" hidden>
        <div class="grid">
          <section class="card span-8">
            <h3 id="bodyCalendarTitle">🌙 身體記錄月曆</h3>
            <div class="library-controls">
              <select id="bodyYear"></select>
              <select id="bodyMonth"></select>
              <button type="button" id="bodyLoadBtn">載入 ✨</button>
            </div>
            <div class="calendar" id="bodyCalendar"></div>
            <p class="status" id="bodyStatus"></p>
          </section>
          <section class="card span-4">
            <div class="panel-heading">
              <h3>🩷 新增記錄</h3>
              <button class="icon-button" type="button" id="bodyTokenSettingsBtn" aria-expanded="false" aria-controls="bodyTokenSettings" title="試算表 Token 設定">⚙️</button>
            </div>
            <div class="settings-panel lock-panel" id="bodyTokenSettings" hidden>
              <label class="full">試算表寫入 Token
                <input id="sheetTokenInput" type="password" placeholder="身體記錄直接寫入 Google Sheet 時使用">
              </label>
              <div class="toolbar">
                <button class="ghost" type="button" id="saveSheetTokenBtn">💾 記住試算表 Token</button>
                <button class="ghost" type="button" id="clearSheetTokenBtn">🧹 清除試算表 Token</button>
              </div>
            </div>
            <form id="bodyForm" class="form-grid" style="margin-top:14px">
              <label class="full">日期<input name="date" type="date" required></label>
              <label class="full">類型
                <select name="type">
                  <option value="月經">🌸 月經來時</option>
                  <option value="氣喘">🫧 氣喘發作日</option>
                </select>
              </label>
              <label>程度
                <select name="severity">
                  <option value="">未指定</option>
                  <option value="輕微">輕微</option>
                  <option value="中等">中等</option>
                  <option value="嚴重">嚴重</option>
                </select>
              </label>
              <label>流量
                <select name="flow">
                  <option value="">未指定</option>
                  <option value="少">少</option>
                  <option value="中">中</option>
                  <option value="多">多</option>
                </select>
              </label>
              <label>疼痛 0-10<input name="painLevel" type="number" min="0" max="10" step="1" placeholder="0"></label>
              <label>氣喘誘因
                <select name="asthmaTrigger">
                  <option value="">未指定</option>
                  <option value="天氣">天氣</option>
                  <option value="灰塵">灰塵</option>
                  <option value="自律神經">自律神經</option>
                  <option value="腸胃">腸胃</option>
                  <option value="嗆到">嗆到</option>
                  <option value="運動">運動</option>
                  <option value="不確定">不確定</option>
                </select>
              </label>
              <label>是否用藥
                <select name="medicineUsed">
                  <option value="">未指定</option>
                  <option value="是">是</option>
                  <option value="否">否</option>
                </select>
              </label>
              <label class="full">備註<textarea name="notes" placeholder="只記錄觀察，不做醫療判斷 ✨"></textarea></label>
              <button class="primary full" type="submit">🌙 寫入身體記錄</button>
            </form>
          </section>
          <section class="card span-12">
            <div class="panel-heading">
              <h3 id="bodyDayTitle">📍 當日記錄</h3>
              <button class="icon-button" type="button" id="bodyLockSettingsBtn" aria-expanded="false" aria-controls="bodyLockSettings" title="當月記錄鎖定設定">⚙️</button>
            </div>
            <div class="settings-panel lock-panel" id="bodyLockSettings" hidden>
              <h3>🔐 當月記錄鎖定</h3>
              <div class="form-grid" style="margin-top:10px">
                <label class="full">解鎖密碼
                  <input id="bodyPasswordInput" type="password" placeholder="輸入身體記錄檢視密碼">
                </label>
                <label class="full">初始設定 / 更換密碼
                  <input id="bodyNewPasswordInput" type="password" placeholder="第一次使用或要更換時填寫">
                </label>
                <button class="primary" type="button" id="bodyUnlockBtn">🔓 解鎖當月記錄</button>
                <button class="ghost" type="button" id="bodySetPasswordBtn">🔐 設定密碼</button>
                <button class="ghost full" type="button" id="bodyLockBtn">🔒 重新上鎖</button>
              </div>
            </div>
            <div class="body-record-list" id="bodyRecordList"><p class="muted">點選月曆日期查看記錄。</p></div>
          </section>
        </div>
      </section>
    </section>
  </main>

  <dialog class="photo-viewer" id="photoViewer">
    <div class="toolbar">
      <button class="ghost" type="button" id="closePhotoViewer">關閉</button>
    </div>
    <img id="photoViewerImg" alt="">
  </dialog>

  <script src="scripts/emilyhome.js"></script>
</body>
</html>
